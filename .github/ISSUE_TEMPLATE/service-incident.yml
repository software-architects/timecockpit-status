name: Service incident
description: Publish an unplanned customer-visible Time Cockpit service incident
title: "[Incident] <customer-visible impact>"
labels: ["status-event", "type:incident", "status:investigating"]
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Include customer-safe facts only—no tenant names, personal data, secrets, traces, or internal infrastructure details.

        Replace the title placeholder with a concise symptom. Use UTC ISO 8601 timestamps (`YYYY-MM-DDTHH:MM:SSZ`). Labels are authoritative for event type, lifecycle, severity, and affected components.
  - type: input
    id: began_at
    attributes:
      label: Incident began (UTC)
      description: Earliest evidence-backed start of customer impact.
      placeholder: "2026-08-29T14:30:00Z"
    validations:
      required: true
  - type: input
    id: ended_at
    attributes:
      label: Incident ended (UTC)
      description: Keep `Ongoing` until recovery is verified, then replace it with the actual end time.
      value: Ongoing
    validations:
      required: true
  - type: input
    id: last_updated_at
    attributes:
      label: Last public update (UTC)
      description: Update whenever the public summary or timeline materially changes.
      placeholder: "2026-08-29T14:45:00Z"
    validations:
      required: true
  - type: input
    id: next_update_at
    attributes:
      label: Next public update by (UTC)
      description: Optional when resolved; required operationally while the incident is active.
      placeholder: "2026-08-29T15:15:00Z"
  - type: textarea
    id: impact
    attributes:
      label: Customer impact
      description: Describe observable symptoms, known scope, and unaffected functionality.
    validations:
      required: true
  - type: textarea
    id: current_update
    attributes:
      label: Current update
      description: State what is known and what customers should expect now.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: Provide a safe workaround or write `None known` when useful.
  - type: textarea
    id: timeline
    attributes:
      label: Public timeline
      description: Append customer-relevant events in chronological order.
      value: |
        - YYYY-MM-DDTHH:MM:SSZ — Initial customer impact detected; investigation started.
    validations:
      required: true
  - type: textarea
    id: resolution
    attributes:
      label: Resolution
      description: Complete before applying `status:resolved` and closing the issue.
  - type: checkboxes
    id: publication_checks
    attributes:
      label: Label and publication checks
      description: Apply labels in the issue sidebar before publishing.
      options:
        - label: I applied exactly one `severity:*` label.
          required: true
        - label: I applied every affected `component:*` label (at least one).
          required: true
        - label: I verified that the title and body contain only customer-safe public information.
          required: true
  - type: markdown
    attributes:
      value: |
        Advance the lifecycle by replacing the `status:*` label: `investigating` → `identified` → `monitoring` → `resolved`. On recovery, set **Incident ended**, complete **Resolution**, apply `status:resolved`, and close the issue. Post a public comment when subscribers should be notified.
